[project]
name = "argus-testing"
version = "0.7.0"
description = "Autonomous QA MCP that tests apps like a real testing engineer and verifies every certified bug"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yichen Wu"}]
urls = {Homepage = "https://yichenwu.dev/projects/argus", Documentation = "https://github.com/chriswu727/argus#readme", Repository = "https://github.com/chriswu727/argus", Issues = "https://github.com/chriswu727/argus/issues"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["testing", "qa", "software-testing", "browser-testing", "autonomous-testing", "qa-engineer", "bug-finding", "ai-agent", "playwright", "exploratory-testing", "mcp", "claude-code", "codex"]
dependencies = [
    "playwright>=1.40.0",
    "litellm>=1.96.2",
    "mcp[cli]>=1.30.0,<2.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "Pillow>=10.0.0",
    "filelock>=3.12,<4",
    "starlette>=0.27,<2",
    "uvicorn>=0.31,<1",
    "typing-extensions>=4.9",
    "aiohttp>=3.14.5",
    "PyJWT>=2.15.1",
    "cryptography>=50.0.2",
    "multidict>=6.9.1",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "httpx>=0.27,<1",
    "pip-audit>=2.9,<3",
]
mac = [
    # Screen mode — installed only on macOS.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
argus = "argus.cli:main"
argus-mcp = "argus.mcp_server:main"
argus-testing = "argus.mcp_server:main"
argus-regression = "argus.cli:regression"
argus-cleanup = "argus.cli:cleanup"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["argus/domain/contracts.py", "argus/domain/replay.py", "argus/domain/verification.py", "argus/settings.py", "argus/ports.py", "argus/application/context.py", "argus/application/telemetry.py", "argus/application/manager.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
