name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip 'setuptools>=83.0.0' && python -m pip install -e '.[dev]'
      - name: Smoke-test package import
        run: python -c "from argus.mcp_server import mcp; assert mcp is not None"
      - name: Audit installed dependencies
        run: python -m pip_audit --vulnerability-service osv --progress-spinner off --skip-editable
      - name: Static checks
        run: |
          ruff check argus tests scripts
          ruff format --check argus tests scripts
          mypy
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        env:
          ARGUS_REQUIRE_BROWSER: "1"
        run: python -m pytest
      - name: Check public distribution contents
        run: |
          python -m pip install build
          python -m build
          python scripts/check_distributions.py dist/*
